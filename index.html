<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소리의 높낮이 측정하기</title>
<link rel="icon" href="favicon.svg?v=1" type="image/svg+xml">
<meta name="theme-color" content="#f3ead8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f3ead8;
    --ink: #161616;
    --blue: #1f3fa8;
    --red: #e8462b;
    --yellow: #f5b90f;
    --green: #2f8a4e;
    --pink: #f07aa8;
    --xl: clamp(72px, 10vw, 168px);
    --l: clamp(30px, 3.8vw, 54px);
    --cut: 42px 14px 48px 20px / 22px 44px 18px 40px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Black Han Sans", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-size: var(--l);
    line-height: 1.15;
    word-break: keep-all;
    overflow-x: hidden;
  }

  /* 마티스 컷아웃 장식 */
  .deco { position: fixed; pointer-events: none; z-index: 0; }
  .deco.a { bottom: -70px; left: -40px; width: 150px; transform: rotate(24deg); fill: var(--green); }
  .deco.b { bottom: -50px; right: -20px; width: 170px; transform: rotate(14deg); fill: var(--pink); }
  .deco.c { top: 30px; right: 30%; width: 70px; fill: var(--yellow); transform: rotate(12deg); }

  .app {
    position: relative; z-index: 1;
    min-height: 100%;
    display: grid;
    grid-template-columns: 1fr minmax(320px, 32%);
    grid-template-rows: auto 1fr;
    gap: 40px 48px;
    padding: 40px 56px 56px;
  }
  h1 { font-size: var(--l); font-weight: 400; letter-spacing: .02em; }

  /* 그래프 */
  .stage {
    position: relative;
    border-radius: var(--cut);
    overflow: hidden;
    min-height: 360px;
    box-shadow: 8px 10px 0 var(--ink);
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .tag {
    position: absolute; left: 20px; z-index: 2;
    padding: 6px 18px 10px;
    border-radius: 26px 10px 24px 12px / 12px 24px 10px 26px;
    background: var(--ink);
    color: #fff;
    pointer-events: none;
  }
  .tag.hi { top: 18px; }
  .tag.lo { bottom: 18px; }

  /* 결과 */
  .side { display: flex; flex-direction: column; gap: 32px; justify-content: center; }
  .word {
    align-self: flex-start;
    padding: 14px 30px 18px;
    border-radius: var(--cut);
    background: #fff;
    color: var(--ink);
    transition: background .25s, color .25s;
  }
  .word.hi { background: var(--red); color: #fff; }
  .word.lo { background: var(--blue); color: #fff; }
  .num { font-size: var(--xl); line-height: .95; font-variant-numeric: tabular-nums; }
  .num small { font-size: var(--l); margin-left: .2em; }
  .num.empty small { display: none; }
  .num { transition: color .25s; }
  .num.hi { color: var(--red); }
  .num.lo { color: var(--blue); }

  button {
    font: inherit;
    align-self: flex-start;
    border: 0;
    cursor: pointer;
    padding: 20px 52px 24px;
    border-radius: 60px 22px 56px 26px / 30px 54px 24px 50px;
    background: var(--ink);
    color: var(--paper);
    box-shadow: 6px 8px 0 var(--red);
    transition: transform .1s, box-shadow .1s;
  }
  button:active { transform: translate(4px, 6px); box-shadow: 2px 2px 0 var(--red); }
  /* 시작(검정 ▶) / 멈춤(흰색 ■, 빨강·파랑은 높고 낮은 소리에만 씀) */
  #btn { display: inline-flex; align-items: center; gap: .35em; }
  #btn .ico { width: .8em; height: .8em; flex: none; }
  #btn.running { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 5px var(--ink), 6px 8px 0 var(--ink); }
  #btn.running:active { box-shadow: inset 0 0 0 5px var(--ink), 2px 2px 0 var(--ink); }
  button:focus-visible { outline: 4px solid var(--blue); outline-offset: 6px; }

  /* 도움말 */
  .top { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  button.help {
    align-self: center;
    width: 84px; height: 84px; padding: 0 0 6px;
    flex: none;
    border-radius: 46% 54% 50% 50% / 52% 46% 54% 48%;
    box-shadow: 5px 7px 0 var(--yellow);
  }
  button.help:active { box-shadow: 2px 2px 0 var(--yellow); }
  #helpClose { padding: 0; display: grid; place-items: center; }
  dialog {
    border: 0; padding: 0; margin: auto;
    width: min(1100px, calc(100vw - 32px));
    max-height: calc(100vh - 32px);
    border-radius: var(--cut);
    background: var(--paper);
    color: var(--ink);
    box-shadow: 10px 12px 0 var(--ink);
    font-size: var(--l);
  }
  dialog::backdrop { background: rgba(22, 22, 22, .6); }
  .guide { padding: 28px 48px 40px; display: flex; flex-direction: column; gap: 24px; }
  .guide-head { display: flex; align-items: center; justify-content: space-between; }
  .guide-head h2 { font-size: var(--l); font-weight: 400; }
  #helpClose { width: 64px; height: 64px; }
  /* 단계 카드: 흰 종이를 오려 붙인 느낌 */
  .steps { list-style: none; padding: 0 0 0 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 36px 40px; counter-reset: step; }
  .steps li {
    position: relative; counter-increment: step;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding: 28px 20px 22px;
    background: #fff;
    border-radius: var(--cut);
    box-shadow: 6px 8px 0 var(--ink);
    text-align: center; line-height: 1.1;
  }
  /* 순서 번호: 카드 모서리에 붙인 스티커 */
  .steps li::before {
    content: counter(step);
    position: absolute; top: -18px; left: -14px;
    width: 1.3em; height: 1.3em; padding-bottom: .08em;
    display: grid; place-items: center;
    border-radius: 46% 54% 50% 50% / 52% 46% 54% 48%;
    background: var(--ink); color: var(--paper);
    box-shadow: 4px 5px 0 var(--red);
  }
  .steps li:nth-child(2)::before { box-shadow: 4px 5px 0 var(--yellow); }
  .steps li:nth-child(3)::before { box-shadow: 4px 5px 0 var(--green); }
  .steps li:nth-child(4)::before { box-shadow: 4px 5px 0 var(--blue); }
  .steps svg { height: 120px; width: auto; max-width: 100%; display: block; }
  .steps span { white-space: nowrap; }
  .steps .hi { color: var(--red); }
  .steps .lo { color: var(--blue); }
  .msg:empty { display: none; }
  .msg { color: var(--red); }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; padding: 24px 16px 40px; gap: 28px; }
    .stage { min-height: 300px; }
    .deco.c { display: none; }
    button.help { width: 64px; height: 64px; }
    .guide { padding: 20px 20px 32px; gap: 24px; }
    #helpClose { width: 52px; height: 52px; }
    .steps { grid-template-columns: 1fr; gap: 36px; padding-left: 10px; }
    .steps li::before { left: -10px; }
  }
</style>
</head>
<body>

<svg class="deco a" viewBox="-10 0 120 200" aria-hidden="true"><path d="M50 0C62 30 92 28 82 60C112 58 112 92 86 100C112 120 102 152 76 146C86 176 66 196 50 200C34 196 14 176 24 146C-2 152-12 120 14 100C-12 92-12 58 18 60C8 28 38 30 50 0Z"/></svg>
<svg class="deco b" viewBox="-10 0 120 200" aria-hidden="true"><path d="M48 0C64 26 90 34 78 62C108 66 106 96 82 104C108 126 96 156 72 148C80 178 62 198 46 198C30 192 18 172 28 148C0 150-8 118 18 104C-8 90-4 62 22 62C14 32 36 24 48 0Z"/></svg>
<svg class="deco c" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 2L58 34L88 14L70 44L98 52L66 60L84 90L54 70L46 98L40 66L10 84L30 56L2 46L34 40L16 12L44 30Z"/></svg>

<main class="app">
  <header class="top">
    <h1>소리의 높낮이 측정하기</h1>
    <button class="help" id="helpBtn" type="button" aria-label="사용법" aria-haspopup="dialog">?</button>
  </header>

  <section class="stage" aria-label="소리 높낮이 그래프">
    <canvas id="graph"></canvas>
    <div class="tag hi">높다</div>
    <div class="tag lo">낮다</div>
  </section>

  <section class="side">
    <div class="word" id="word">소리를 내요</div>
    <div class="num empty" id="num">?<small>Hz</small></div>
    <button id="btn" type="button" aria-label="시작"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5L21 12L6 20.5Z" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg><span>시작</span></button>
    <div class="msg" id="msg" role="status"></div>
  </section>
</main>

<dialog id="help" aria-label="사용법">
  <div class="guide">
    <div class="guide-head"><h2>사용법</h2><button type="button" id="helpClose" class="help" aria-label="닫기"><svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><path d="M9 9L31 31M31 9L9 31" stroke="currentColor" stroke-width="7" stroke-linecap="round"/></svg></button></div>
    <ol class="steps">
      <li>
        <svg viewBox="0 0 240 180" aria-hidden="true">
          <path d="M40 74C40 52 62 46 120 46C186 46 206 52 206 80C206 114 190 126 120 126C58 126 40 114 40 74Z" fill="#e8462b" transform="translate(8 9)"/>
          <path d="M40 74C40 52 62 46 120 46C186 46 206 52 206 80C206 114 190 126 120 126C58 126 40 114 40 74Z" fill="#161616"/>
          <text x="123" y="100" text-anchor="middle" font-family="Black Han Sans, sans-serif" font-size="38" fill="#f3ead8">시작</text>
          <path d="M200 10L205 28L222 18L212 34L230 40L211 44L220 60L204 50L198 68L194 49L177 57L188 42L172 34L190 31L181 15L196 26Z" fill="#f5b90f"/>
          <path transform="translate(26 8)" d="M96 176C92 160 96 146 108 140L112 116C113 108 124 108 125 116L127 136C140 134 152 140 152 154L150 176Z" fill="#fff" stroke="#161616" stroke-width="4" stroke-linejoin="round"/>
        </svg>
        <div>시작을 눌러요</div>
      </li>
      <li>
        <svg viewBox="0 0 240 180" aria-hidden="true">
          <rect x="28" y="10" width="184" height="160" rx="18" fill="#fff" stroke="#161616" stroke-width="4"/>
          <path d="M50 30a6 6 0 0 1 12 0v10a6 6 0 0 1-12 0z" fill="#161616"/>
          <path d="M46 40a10 10 0 0 0 20 0M56 50v6" fill="none" stroke="#161616" stroke-width="3" stroke-linecap="round"/>
          <rect x="74" y="32" width="100" height="10" rx="5" fill="#d9d2c3"/>
          <rect x="44" y="68" width="152" height="30" rx="15" fill="#f5b90f" stroke="#161616" stroke-width="3"/>
          <text x="120" y="88" text-anchor="middle" font-family="Black Han Sans, sans-serif" font-size="14" fill="#161616">사이트에 있는 동안 허용</text>
          <rect x="44" y="106" width="152" height="24" rx="12" fill="#bfe9f5"/>
          <rect x="44" y="136" width="152" height="24" rx="12" fill="#bfe9f5"/>
          <path transform="translate(92 -26)" d="M96 176C92 160 96 146 108 140L112 116C113 108 124 108 125 116L127 136C140 134 152 140 152 154L150 176Z" fill="#fff" stroke="#161616" stroke-width="4" stroke-linejoin="round"/>
        </svg>
        <div>허용을 눌러요</div>
      </li>
      <li>
        <svg viewBox="0 0 240 180" aria-hidden="true">
          <path d="M18 62Q18 50 30 50L142 50Q154 50 153 62L145 152Q143 164 131 164L41 164Q29 164 27 152Z" fill="#f5b90f"/>
          <g fill="#fff" stroke="#161616" stroke-width="3">
            <rect x="38" y="58" width="10" height="44" rx="5"/><rect x="54" y="58" width="10" height="58" rx="5"/>
            <rect x="70" y="58" width="10" height="72" rx="5"/><rect x="86" y="58" width="10" height="84" rx="5"/>
            <rect x="102" y="58" width="10" height="72" rx="5"/><rect x="118" y="58" width="10" height="58" rx="5"/>
          </g>
          <g fill="none" stroke="#161616" stroke-width="6" stroke-linecap="round">
            <path d="M168 18q12 12 0 24"/><path d="M184 8q22 22 0 44"/>
          </g>
        </svg>
        <div>가까이에서 연주해요</div>
      </li>
      <li>
        <svg viewBox="0 0 240 180" aria-hidden="true">
          <defs><clipPath id="g"><path d="M20 30Q20 14 44 14L208 12Q222 12 222 30L220 152Q220 168 200 168L36 170Q20 170 20 152Z"/></clipPath></defs>
          <g clip-path="url(#g)">
            <rect width="240" height="180" fill="#1f3fa8"/>
            <path d="M0 0H240V104Q180 96 120 104T0 102Z" fill="#f5b90f"/>
            <path d="M0 0H240V84Q180 76 120 84T0 82Z" fill="#e8462b"/>
          </g>
          <path d="M44 148H76V126H104V60H134V40H170" fill="none" stroke="#161616" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M44 148H76V126H104V60H134V40H170" fill="none" stroke="#fff" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M184 40L188 28L196 36L200 24L204 38L216 34L208 44L218 52L204 50L200 62L194 50L184 56L188 46L176 42Z" fill="#161616"/>
        </svg>
        <div><span class="hi">위는 높은 소리</span><br><span class="lo">아래는 낮은 소리</span></div>
      </li>
    </ol>
  </div>
</dialog>

<script src="tracker.js?v=12"></script>
<script>
(() => {
  // 높낮이 기준 (Hz)
  // 솔(392)과 라(440) 사이를 경계로: 도레미파솔 = 낮은 소리, 라부터 = 높은 소리
  const SPLIT = 415;
  const FMIN = 150, FMAX = 1500;           // 그래프 아래끝/위끝
  const TICK = 30;                        // 30ms마다 측정
  const HISTORY = 270;                    // 약 8초

  const COLORS = { hi: '#e8462b', mid: '#f5b90f', lo: '#1f3fa8', ink: '#161616' };

  const canvas = document.getElementById('graph');
  const ctx = canvas.getContext('2d');
  const wordEl = document.getElementById('word');
  const numEl = document.getElementById('num');
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  const START_HTML = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5L21 12L6 20.5Z" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg><span>시작</span>';
  const STOP_HTML = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3" fill="currentColor"/></svg><span>멈춤</span>';

  let audioCtx, analyser, stream, buf, timer;
  let history = new Array(HISTORY).fill(null);
  let tracker;

  const band = f => f >= SPLIT ? 'hi' : 'lo';
  // 그래프 높이: 낮은 소리는 노란 띠 아래(파랑), 높은 소리는 노란 띠 위(빨강)에만 놓이게
  const norm = f => (Math.log(f) - Math.log(FMIN)) / (Math.log(FMAX) - Math.log(FMIN));
  const tS = norm(SPLIT), GAP = 0.07;
  const toY = (t, h) => h - Math.min(1, Math.max(0, t)) * h;
  const yOf = (f, h) => {
    let t = Math.min(1, Math.max(0, norm(f)));
    t = t < tS ? (t / tS) * (tS - GAP) : tS + GAP + ((t - tS) / (1 - tS)) * (1 - tS - GAP);
    return toY(t, h);
  };

  function tick() {
    analyser.getFloatTimeDomainData(buf);
    const { val, fresh } = tracker.step(buf, audioCtx.sampleRate);
    if (fresh) show(val);
    history.push(val); history.shift();
    draw();
  }

  function show(f) {
    const b = band(f);
    wordEl.className = 'word ' + b;
    wordEl.textContent = b === 'hi' ? '높은 소리' : '낮은 소리';
    numEl.firstChild.textContent = Math.round(f);
    numEl.className = 'num ' + b;
  }

  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // 빨강(높은 소리) · 노랑(경계 띠) · 파랑(낮은 소리), 종이를 오려 붙인 듯 살짝 물결
    const yMidTop = toY(tS + GAP * 0.7, h), yMidBot = toY(tS - GAP * 0.7, h);
    const wave = (y, amp, seed) => {
      ctx.lineTo(w, y);
      for (let i = 12; i >= 0; i--) {
        const x = (w * i) / 12;
        ctx.lineTo(x, y + Math.sin(x / 70 + seed) * amp);
      }
    };
    ctx.fillStyle = COLORS.lo; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = COLORS.mid;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(w, 0); wave(yMidBot, 6, 1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = COLORS.hi;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(w, 0); wave(yMidTop, 6, 3); ctx.closePath(); ctx.fill();

    // 지나간 소리: 하얀 종이 띠 (가까운 소리끼리는 이어서)
    const step = (w - 70) / (HISTORY - 1);
    const r = Math.max(4, Math.min(7, h / 70));   // 선 반쪽 두께
    ctx.lineCap = ctx.lineJoin = 'round';
    ctx.beginPath();
    let prev = -1;
    for (let i = 0; i < HISTORY; i++) {
      const f = history[i];
      if (f == null) continue;
      const x = 20 + i * step, y = yOf(f, h);
      if (prev >= 0 && i - prev <= 20) ctx.lineTo(x, y);
      else { ctx.moveTo(x, y); ctx.lineTo(x + 0.1, y); }
      prev = i;
    }
    ctx.strokeStyle = COLORS.ink; ctx.lineWidth = r * 2 + 5; ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = r * 2; ctx.stroke();

    // 지금 소리: 검은 별
    const last = history[HISTORY - 1];
    if (last != null) star(20 + (HISTORY - 1) * step, yOf(last, h), Math.max(22, h / 14));
  }

  function star(cx, cy, R) {
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(0.2);
    ctx.fillStyle = COLORS.ink;
    ctx.beginPath();
    for (let i = 0; i < 16; i++) {
      const rr = i % 2 ? R * 0.45 : R * (i % 4 ? 0.9 : 1);
      const a = (i / 16) * Math.PI * 2;
      ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  async function start() {
    msg.textContent = '';
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
    } catch (e) {
      msg.textContent = '마이크를 허용해 주세요';
      return;
    }
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    buf = new Float32Array(analyser.fftSize);
    tracker = createPitchTracker();
    // 180Hz 아래(책상 '퉁', 전기 웅웅거림)를 걸러낸 뒤 측정
    let node = src;
    for (let i = 0; i < 2; i++) {
      const hp = audioCtx.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 180; hp.Q.value = Math.SQRT1_2;
      node.connect(hp); node = hp;
    }
    node.connect(analyser);
    timer = setInterval(tick, TICK);
    btn.innerHTML = STOP_HTML; btn.classList.add('running'); btn.setAttribute('aria-label', '멈춤');
  }

  function stop() {
    clearInterval(timer);
    stream && stream.getTracks().forEach(t => t.stop());
    audioCtx && audioCtx.close();
    audioCtx = null;
    btn.innerHTML = START_HTML; btn.classList.remove('running'); btn.setAttribute('aria-label', '시작');
  }

  btn.addEventListener('click', () => audioCtx ? stop() : start());

  // 사용법
  const help = document.getElementById('help');
  document.getElementById('helpBtn').addEventListener('click', () => help.showModal());
  document.getElementById('helpClose').addEventListener('click', () => help.close());
  help.addEventListener('click', e => { if (e.target === help) help.close(); });
  window.addEventListener('resize', draw);
  draw();
})();
</script>
</body>
</html>
